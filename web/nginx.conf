# Source-of-truth nginx vhost for critterfeature.com on coquin.
# Deploy by: scp web/nginx.conf coquin:/etc/nginx/sites-available/critterfeature.com
# (deploy.sh does this automatically.)
#
# Cache strategy:
#   - HTML must always revalidate (Cache-Control: no-cache) so updates land on the
#     next visit. Otherwise browsers heuristically cache index.html and keep
#     loading the previous bundle hash. (This bit us during M1 v0.1 — see
#     cowork chat a299eb0f.)
#   - /assets/ (Vite hashed filenames) are content-addressed → safe to cache
#     forever with `public, immutable`.

server {
    server_name critterfeature.com www.critterfeature.com;

    root /var/www/critterfeature;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl;      # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/critterfeature.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/critterfeature.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.critterfeature.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = critterfeature.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name critterfeature.com www.critterfeature.com;
    return 404;
}
