<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Gentleman Engineer favicon: gear + serif G monogram -->
  <!-- Clean at any size from 16x16 up -->
  <defs>
    <style>
      .gear { fill: #C9A961; }
      .ring { fill: none; stroke: #1F3A5F; stroke-width: 1.5; }
      .g    { fill: #1F3A5F; font-family: Georgia, "Times New Roman", serif; font-weight: 700; }
    </style>
  </defs>

  <!-- Outer ring -->
  <circle class="ring" cx="32" cy="32" r="30"/>

  <!-- Gear (12 teeth) -->
  <g transform="translate(32 32)">
    <g fill="#C9A961">
      <circle r="22"/>
    </g>
    <g fill="#C9A961">
      <!-- 12 teeth via rotated rectangles -->
      <g>
        <rect x="-3" y="-26" width="6" height="6" rx="1"/>
        <rect x="-3" y="-26" width="6" height="6" rx="1" transform="rotate(30)"/>
        <rect x="-3" y="-26" width="6" height="6" rx="1" transform="rotate(60)"/>
        <rect x="-3" y="-26" width="6" height="6" rx="1" transform="rotate(90)"/>
        <rect x="-3" y="-26" width="6" height="6" rx="1" transform="rotate(120)"/>
        <rect x="-3" y="-26" width="6" height="6" rx="1" transform="rotate(150)"/>
        <rect x="-3" y="-26" width="6" height="6" rx="1" transform="rotate(180)"/>
        <rect x="-3" y="-26" width="6" height="6" rx="1" transform="rotate(210)"/>
        <rect x="-3" y="-26" width="6" height="6" rx="1" transform="rotate(240)"/>
        <rect x="-3" y="-26" width="6" height="6" rx="1" transform="rotate(270)"/>
        <rect x="-3" y="-26" width="6" height="6" rx="1" transform="rotate(300)"/>
        <rect x="-3" y="-26" width="6" height="6" rx="1" transform="rotate(330)"/>
      </g>
    </g>
    <!-- Inner field for G -->
    <circle r="17" fill="#F5EFE0"/>
  </g>

  <!-- Serif G -->
  <text class="g" x="32" y="44" text-anchor="middle" font-size="32">G</text>
</svg>
